name: Build & deploy (live prices)
on:
  push: {branches: [main]}
  workflow_dispatch: {}
  schedule:
    # Off-round minutes on purpose: GitHub drops/delays many :00 and */10 jobs under load.
    - cron: '7,22,37,52 13-21 * * 1-5'   # every 15 min, ~9 AM-5:30 PM ET weekdays (market hours)
    - cron: '12,42 0-12,22-23 * * 1-5'   # every 30 min weekday off-hours (sports markets)
    - cron: '12,42 * * * 0,6'            # every 30 min weekends
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build with fresh prices (Yahoo Finance + Polymarket)
        run: SITE_URL=https://readdailyfive.com python3 build.py
      - name: Persist frozen exits
        run: |
          if ! git diff --quiet -- data/exits.json; then
            git config user.name "The Daily Five bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/exits.json && git commit -m "Update exits [skip ci]" && git push || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
      - name: Ping IndexNow (new URLs to Bing & co., push builds only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: sleep 20 && SITE_URL=https://readdailyfive.com python3 indexnow.py
